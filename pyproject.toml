[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sukuna-pet"
version = "0.2.1"
description = "宿傩桌宠 V5：头眼阶段推进、点击回弹、持续跳动与动态贴边"
requires-python = ">=3.12"
dependencies = ["PySide6==6.12.0"]

[project.scripts]
sukuna-pet = "sukuna_pet.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sukuna_pet = ["assets/*.png", "assets/*.json", "integrations/dsh-bridge/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
files = ["src"]
